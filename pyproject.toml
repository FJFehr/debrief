[project]
name = "debrief"
version = "0.1.0"
description = "Debrief, a paper review assistant: turn an annotated PDF into a drafted review"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
extract = "src.extract:main"
summarise = "src.summarise:main"
pipeline = "src.pipeline:main"
review = "src.review:main"
interview = "src.interview_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = ["network: fetches from live sites (run with: uv run pytest -m network)"]
addopts = "-m 'not network'"
