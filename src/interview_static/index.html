<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debrief</title>
<script>
  // Light or dark: the reviewer's last choice, else the system setting. Set before the first paint.
  (() => {
    let t = null;
    try { t = localStorage.getItem("interview-theme"); } catch (_) {}
    document.documentElement.dataset.theme = t === "dark" || t === "light" ? t
      : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  })();
</script>
<style>
  /* Colour by role. Teal: the reviewer's words and what can be acted on. Gold: Claude's own points.
     Brick: what is still open, and errors. Everything else is neutral.
     Sizes are 12, 14, 16 and 20px; spacing moves in steps of 4 and 8; one corner radius.
     Type follows the reviewer's template: titles and labels in the serif, text in the sans. */
  :root {
    color-scheme: light;
    --bg: #f0ece3; --panel: #f8f5ef; --ink: #2a2521; --muted: #6e6759; --line: #dacfba; --edge: #8a806b; --chip: #ece8de;
    --accent: #267268; --accent-ink: #f8f5ef; --link: #267268; --link-on-tint: #1c564e; --mark: #2f8f82; --mine: #c1ddda;
    --model: #796117; --model-tint: #efe3be; --warn: #8e423b; --warn-tint: #e8cbc9;
    --paper-bg: #ded6c5; --shadow: rgba(40, 30, 15, .28);
    /* On the page itself, which stays white in both themes. */
    --locator: #267268; --badge: #26221d; --badge-ink: #ffffff;
    --r: 8px; --bar: 48px; --gutter: 16px; --marker: 2.4em;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e1a16; --panel: #28231e; --ink: #ede6d8; --muted: #a79c8a; --line: #3a332b; --edge: #786d5c; --chip: #332d26;
    --accent: #63aba1; --accent-ink: #1e1a16; --link: #8dc1ba; --link-on-tint: #8dc1ba; --mark: #63aba1; --mine: #1c2d2a;
    --model: #e1cc88; --model-tint: #332c1a; --warn: #d5a09b; --warn-tint: #33221f;
    --paper-bg: #14110e; --shadow: rgba(0, 0, 0, .6);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  #app { --rail: 250px; display: grid; grid-template-columns: var(--rail) minmax(380px, min(38%, 680px)) 1fr; height: 100vh; }
  #app.norail, #app.legacy { grid-template-columns: minmax(380px, min(42%, 720px)) 1fr; }
  #app.norail #rail, #app.legacy #rail { display: none; }
  button, select { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--edge); border-radius: var(--r); padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary, button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary { font-weight: 600; }
  button.small { padding: 2px 8px; }
  button.icon { width: 32px; height: 32px; padding: 0; font-size: 16px; line-height: 1; flex: none; }
  a { color: var(--link); }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  code { background: var(--chip); border-radius: 4px; padding: 0 4px; font-size: 14px; }

  /* the top bar: one height in all three panes, so the rule under it runs straight across */
  .bar { flex: 0 0 var(--bar); height: var(--bar); display: flex; align-items: center; gap: 8px; padding: 0 var(--gutter); border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .spacer { flex: 1; }

  /* rail: the flow, then the index. The bar on its right edge is dragged to resize it or to put it away. */
  #grip { position: absolute; left: -4px; top: 0; bottom: 0; width: 9px; cursor: col-resize; z-index: 6; touch-action: none; }
  #grip:hover, #grip.drag { background: color-mix(in srgb, var(--accent) 30%, transparent); }
  #gripTab { position: absolute; top: 50%; left: -3px; transform: translateY(-50%); width: 15px; height: 48px; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--edge); border-radius: var(--r); color: var(--muted); font-size: 14px; line-height: 1; cursor: pointer; user-select: none; }
  #gripTab:hover { color: var(--ink); border-color: var(--ink); }
  #app.norail #grip { left: 0; width: 16px; background: var(--chip); border-right: 1px solid var(--line); cursor: pointer; }
  #app.norail #gripTab { left: 0; width: 15px; border: 0; background: none; }
  #app.norail #mid { padding-left: 16px; }
  #app.legacy #grip { display: none; }
  #brand { font-family: var(--serif); font-size: 16px; flex: none; }
  /* The hover over a note or a point: large, at once, in the note's own colour. Dark ink in both themes. */
  #tip { position: fixed; z-index: 20; display: none; max-width: min(480px, 60vw); padding: 12px 16px; border-radius: var(--r); font: 18px/1.4 var(--sans); color: #1d1a16; background: #ffe36e; box-shadow: 0 4px 16px var(--shadow); pointer-events: none; white-space: pre-wrap; overflow-wrap: anywhere; }
  #tip b { display: block; font-size: 14px; margin-bottom: 4px; }
  #rail { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); font-size: 14px; }
  #paperName { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #flow { padding: 8px; border-bottom: 1px solid var(--line); }
  #index { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  #index .label { margin: 12px 8px 4px; }
  #index .hint { margin-left: 8px; }
  #index summary { cursor: pointer; }
  /* Ticks in the flow and IDs in the index share one column. */
  .step, .irow { display: flex; gap: 4px; padding: 4px 8px; border-radius: var(--r); color: var(--ink); text-decoration: none; }
  .step .mark, .irow b { flex: 0 0 var(--marker); }
  a.step:hover, a.irow:hover { background: var(--chip); }
  .step.later { color: var(--muted); }
  .step.current { font-weight: 600; }
  .step .mark { color: var(--mark); }
  a.step.sel, a.step.sel:hover, .irow.sel, .irow.sel:hover { background: var(--mine); }
  .irow .arrows { margin-left: auto; white-space: nowrap; visibility: hidden; }
  .irow:hover .arrows { visibility: visible; }
  .arrows span { padding: 0 4px; cursor: pointer; color: var(--muted); }
  .irow.sel .arrows span { color: var(--ink); }
  .arrows span:hover { color: var(--link); }

  /* small parts */
  .label { font-family: var(--serif); font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .label .sub { font-family: var(--sans); font-weight: 400; color: var(--muted); }
  .tag { display: inline-block; background: var(--chip); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12px; line-height: 1.6; white-space: nowrap; }
  a.tag { color: var(--link); text-decoration: none; }
  .tag.model { background: var(--model-tint); color: var(--model); border-color: transparent; font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--edge); margin-right: 4px; }
  .flag { display: inline-block; background: var(--warn-tint); color: var(--warn); border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 600; line-height: 1.6; white-space: nowrap; }
  .error { color: var(--warn); font-size: 14px; }
  .hint { color: var(--muted); font-size: 14px; }
  .hint p { margin: 0 0 4px; }
  .callout { background: var(--warn-tint); border-radius: var(--r); padding: 8px 12px; font-size: 14px; }
  .callout .label { color: var(--warn); }
  .callout ul { margin: 0; padding-left: 20px; }
  .callout a { color: inherit; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.more { margin-top: 4px; font-size: 14px; }
  details.more[open] > summary { margin-bottom: 4px; }

  /* middle pane */
  #mid { position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #head > b { font-family: var(--serif); font-size: 20px; line-height: 1; }
  #log { flex: 1; overflow-y: auto; padding: var(--gutter); display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; overflow-wrap: anywhere; }
  .card.mine { background: var(--mine); border-color: transparent; align-self: flex-end; max-width: 92%; white-space: pre-wrap; }
  .card.mine a { color: var(--link-on-tint); }
  .card.mine .tag { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; }
  .card .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .card .head b { font-family: var(--serif); font-size: 16px; color: var(--ink); }
  .card p { margin: 0 0 8px; } .card p:last-child { margin-bottom: 0; }
  .card ul, .card ol { margin: 0 0 8px; padding-left: 20px; }
  .card h3, .card h4, .card h5 { margin: 12px 0 4px; font-family: var(--serif); font-size: 16px; }
  .card blockquote { margin: 0 0 8px; padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); }
  .card hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .card > .label { margin-top: 12px; }
  .card > .hint { margin-top: 8px; }
  .field { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 12px; }
  .fieldhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  /* One thing the reviewer is asked: its number, the question, then what it rests on. */
  .ask { display: grid; grid-template-columns: var(--marker) minmax(0, 1fr); gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); }
  .ask:first-of-type { border-top: 0; padding-top: 0; }
  .ask .num { color: var(--muted); }
  .ask .q { font-weight: 600; }
  .ask .notes { font-size: 14px; margin-top: 4px; }
  .ask.done { color: var(--muted); } .ask.done .q { font-weight: 400; }
  .bullet { display: grid; grid-template-columns: var(--marker) minmax(0, 1fr); gap: 4px; border-top: 1px solid var(--line); padding: 8px 0; cursor: pointer; }
  .bullet:hover { background: var(--chip); }
  .bullet.dropped { color: var(--muted); text-decoration: line-through; }
  .plan { font-size: 14px; }
  #planCard .plan { font-size: 16px; padding-left: 0; list-style: none; }
  #planCard .plan li { padding: 4px 0; border-top: 1px solid var(--line); }
  #sents { margin-top: 8px; }
  #sents ol { margin: 0; padding-left: 24px; }
  .saved { color: var(--mark); font-weight: 600; font-size: 14px; }
  details.history { border-top: 1px solid var(--line); padding-top: 8px; }
  details.history[open] { display: flex; flex-direction: column; gap: 12px; }
  /* the open entry */
  .src { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .under { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 14px; }
  .still { background: var(--warn-tint); color: var(--warn); border-radius: var(--r); padding: 4px 12px; font-size: 14px; margin-top: 8px; }
  .still button { color: var(--ink); }
  .part { display: block; margin-top: 8px; }
  .part .label { font-size: 12px; }
  .finding { border-top: 1px solid var(--line); padding: 8px 0; }
  .finding.done { color: var(--muted); }
  .finding .label { margin-top: 8px; }
  .suggest { background: var(--bg); border-radius: var(--r); padding: 8px 12px; margin-bottom: 8px; }
  .finding .row { margin-top: 4px; }
  #composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px var(--gutter); display: flex; flex-direction: column; gap: 8px; max-height: 64vh; overflow-y: auto; }
  textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--edge); border-radius: var(--r); padding: 8px 12px; }
  textarea { min-height: 120px; resize: vertical; flex-shrink: 0; display: block; }
  .part textarea { min-height: 72px; }
  textarea:focus-visible, input[type=text]:focus-visible { outline-offset: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #micHint { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.front { font-size: 14px; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; max-height: 32vh; overflow-y: auto; flex-shrink: 0; }
  details.front h5 { margin: 8px 0 4px; font-size: 14px; }
  details.front p { margin: 0 0 8px; white-space: pre-wrap; }
  .points { display: flex; flex-direction: column; gap: 4px; max-height: 30vh; overflow-y: auto; font-size: 14px; flex-shrink: 0; }
  .obs { display: flex; gap: 8px; align-items: flex-start; }
  .obs .text { flex: 1; }
  .claim { cursor: text; border-bottom: 1px dashed var(--edge); }

  /* right pane: the paper. The page and the reviewer's highlights keep their own colours in both themes. */
  #right { display: flex; flex-direction: column; min-height: 0; background: var(--paper-bg); }
  #paperScroll { position: relative; flex: 1; overflow-y: auto; padding: var(--gutter); }
  .page { position: relative; max-width: 900px; margin: 0 auto; background: #fff; box-shadow: 0 1px 4px var(--shadow); }
  .page img { display: block; width: 100%; height: auto; }
  .badge { position: absolute; transform: translate(-2px, -2px); background: var(--badge); color: var(--badge-ink); font-size: 12px; font-weight: 600; line-height: 1; padding: 3px 5px; border-radius: 4px; cursor: pointer; opacity: .88; }
  .badge:hover { opacity: 1; }
  .badge.over { transform: translate(-2px, -95%); }  /* above a highlight, so the marked words stay readable */
  /* The marker that points to a place is an outline with no fill, so it never tints a highlight. */
  .flash { position: absolute; border: 2px solid var(--locator); box-shadow: 0 0 0 4px color-mix(in srgb, var(--locator) 25%, transparent); border-radius: 4px; pointer-events: none; animation: flash 2.4s ease-out forwards; }
  @keyframes flash { 0% { opacity: 0; } 12% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  /* Notes under a page sit on one grid: ID, line, colour, text. */
  .pagenotes { display: grid; grid-template-columns: auto auto auto minmax(0, 1fr); column-gap: 8px; max-width: 900px; margin: 0 auto 16px; background: var(--panel); border-radius: 0 0 var(--r) var(--r); padding: 8px 12px; font-size: 14px; }
  .pagenotes .label { grid-column: 1 / -1; }
  .pagenotes .note { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .pagenotes .tag { justify-self: start; max-width: 12em; overflow: hidden; text-overflow: ellipsis; }
  .pagenotes .text { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="bar"><b id="brand">Debrief</b><span id="paperName">Loading…</span></div>
    <div id="flow"></div>
    <div id="index"></div>
  </nav>
  <section id="mid">
    <div id="grip" role="separator" aria-orientation="vertical"><span id="gripTab">‹</span></div>
    <header id="head" class="bar"></header>
    <div id="log"></div>
    <div id="composer"></div>
  </section>
  <section id="right">
    <div class="bar"><span id="pageNow" class="hint"></span><span class="spacer"></span><button id="themeBtn" class="icon"></button></div>
    <div id="paperScroll"><div id="pages"></div></div>
  </section>
</div>
<div id="tip"></div>

<script>
"use strict";
const STEPS = [["brief", "Overview"], ["summary", "Summary"], ["strengths", "Strengths"], ["weaknesses", "Weaknesses"],
               ["comments", "Comments"], ["bias", "Bias test"], ["draft", "Draft"], ["final", "Final"]];
const STEP_NAME = Object.fromEntries(STEPS);
const SECTIONS = ["summary", "strengths", "weaknesses", "comments", "bias"];
const KINDS = [["strength", "Strengths"], ["weakness", "Weaknesses"], ["comment", "Comments"]];
const SECTION_KIND = {strengths: "strength", weaknesses: "weakness", comments: "comment"};
// The parts behind an entry's text, by kind. They sit folded away under the text.
const PARTS = {
  strength: [["claim", "Label in the index"], ["body", "What the paper does and why it matters"], ["where", "Where it shows"]],
  weakness: [["claim", "Label in the index"], ["body", "What is missing"], ["where", "Where it shows"],
             ["undermines", "Which claim it undermines"], ["resolve", "What would resolve it"]],
  comment: [["claim", "Label in the index"]],
  observation: [["claim", "Label in the index"], ["body", "Claude's observation"], ["where", "Where it shows"]],
};
const GAPS = {where: "location", resolve: "fix"};
const TURN_TAG = {brief: "said before going on", answer: "answer", change: "change requested", accept: "accepted", skip: "skipped",
                  talk: "said", plan: "plan requested", apply: "plan agreed"};
const EMPTY_TAG = {brief: "went on", answer: "wording left to Claude", apply: "plan agreed"};
const HEADING = {brief: "Overview of your notes"};
// Marks a point Claude raised itself, until the reviewer adopts or drops it.
const CLAUDES = `<span class="tag model">Claude's</span>`;
const $ = (id) => document.getElementById(id);
let view = null;          // last /api/state
let busy = false;         // a request is in flight
let busySince = 0;        // when the model started working, for the timer; 0 when it is not
let errorText = "";
let unsent = "";          // what the reviewer is saying or typing, kept across re-renders and failed sends
let edits = {};           // hand edits to the summary and to the final text, until they are saved
let sel = null;           // the step shown in the middle pane
let openId = null;        // the entry open in the editor
let stageSeen = null;
let shown = {};           // what the last draw showed, to scroll to what is new
let paperDrawn = false;
let copyables = [];       // Markdown source behind each Copy button
let unfolded = new Set(); // the folded parts the reviewer has opened, so a redraw leaves them open
let micSel = "#say";      // the text box dictation writes into: the one last clicked in

const stepNow = () => (view.session.stage === "new" ? "brief" : view.session.stage);
const stepAt = (step) => STEPS.findIndex(([k]) => k === step);
const entries = () => view.session.entries || [];
// An entry by its ID, or by an ID it had before it was moved to another kind.
const entryOf = (id) => entries().find((e) => e.id === id) || entries().find((e) => (e.was || []).includes(id));
const live = (kind) => entries().filter((e) => e.kind === kind && !e.dropped);
// What is still open on an entry: a missing location or fix, or a fact from the paper that cuts against it.
const countered = (e) => !e.dropped && (e.gaps || []).includes("counter");
function needs(e) {
  if (e.dropped) return "";
  const missing = (e.gaps || []).filter((g) => GAPS[g]).map((g) => GAPS[g]);
  return [missing.length ? `no ${missing.join(" or ")} yet` : "", countered(e) ? "the paper says otherwise" : ""].filter(Boolean).join("; ");
}
const lastClaude = () => (view.session.turns.findLast((t) => t.role === "claude") || {fields: {}}).fields;
const clip = (text, n) => (text.length > n ? text.slice(0, n - 1).trimEnd() + "…" : text);
// A part that stays folded until the reviewer opens it.
const fold = (key, summary, body, cls = "more") =>
  `<details class="${cls}" data-k="${key}"${unfolded.has(key) ? " open" : ""}><summary>${summary}</summary>${body}</details>`;

// What is still open in a section, or before the draft. `undecided` must be settled; `gaps` may be accepted.
function openItems(step) {
  const kinds = {summary: [], strengths: ["strength"], weaknesses: ["weakness"], comments: ["comment"], bias: ["strength", "weakness"]}[step] || ["strength", "weakness", "comment"];
  const gaps = entries().filter((e) => kinds.includes(e.kind) && needs(e)).map((e) => `${e.id}: ${needs(e)}.`);
  const undecided = step === "weaknesses" ? live("observation").map((e) => `${e.id} is Claude's: make it a weakness or a comment, or drop it.`) : [];
  const all = [...undecided, ...gaps];
  const html = all.length ? `<div class="callout"><div class="label">${undecided.length ? "Before you can accept" : "Still open"}</div><ul>${all.map((x) => `<li>${inline(x)}</li>`).join("")}</ul></div>` : "";
  return {gaps, undecided, html};
}

// The drafting output is the review, then a line of ---, then the part for the reviewer only.
function splitDraft(text) {
  const m = text.match(/^\s*---+\s*$/m);
  return m ? [text.slice(0, m.index).trim(), text.slice(m.index + m[0].length).trim()] : [text.trim(), ""];
}

/* ---------- what the reviewer does, for the stock-take after a paper ---------- */

let tracked = [];
function track(event, data = {}) { tracked.push({event, at: new Date().toISOString(), ...data}); }
function sendTracked() {
  if (!tracked.length) return;
  const events = tracked;
  tracked = [];
  try {
    fetch("/api/event", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({events}), keepalive: true}).catch(() => {});
  } catch (_) {}
}
setInterval(sendTracked, 3000);
addEventListener("pagehide", sendTracked);

/* ---------- text rendering ---------- */

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function anchorKey(kind, label) {
  kind = kind.toLowerCase().replace("fig.", "figure").replace("eq.", "equation");
  label = label.toLowerCase();
  const anchors = view.paper.anchors;
  for (const k of [`${kind} ${label}`, `section ${label}`, `appendix ${label}`]) if (anchors[k]) return k;
  return null;
}

// Turn references to places in the paper, and entry IDs, into links. Input is already HTML-escaped.
const REF_RE = /\b(A\d+)\b|\b(?:L|[Ll]ines?\s+)(\d+)(?:\s*[–-]\s*(\d+))?\b|\b(Table|Figure|Fig\.|Equation|Eq\.|Section|Appendix)\s+([A-Z](?:\.\d+)*|\d+(?:\.\d+)*)|\b[Pp]age\s+(\d+)\b|\b([SWCO]\d+)\b/g;
function linkify(html) {
  return html.replace(REF_RE, (m, ann, l1, l2, kind, label, page, entry) => {
    if (ann) { const a = view.paper.annotations.find((x) => x.id === ann); return a ? `<a href="#" data-ref="ann:${ann}"${tipOf(a.note, ann, a.hex)}>${m}</a>` : m; }
    if (l1) return view.paper.lines[l1] ? `<a href="#" data-ref="line:${l1}:${l2 || l1}">${m}</a>` : m;
    if (kind) { const key = anchorKey(kind, label); return key ? `<a href="#" data-ref="anchor:${key}">${m}</a>` : m; }
    if (page) return +page <= view.paper.pages.length ? `<a href="#" data-ref="page:${page}">${m}</a>` : m;
    const e = entryOf(entry);
    return e ? `<a href="#" data-entry="${e.id}"${tipOf(e.claim, e.id)}>${m}</a>` : m;
  });
}
// The attributes behind the hover card: its text, its heading and, for a note, the note's colour.
const tipOf = (text, head, colour) => (text ? ` data-tip="${esc(text)}" data-tip-head="${esc(head || "")}"${colour ? ` data-tip-colour="${esc(colour)}"` : ""}` : "");

function inline(text) {
  let h = esc(text);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  return linkify(h);
}

// A small Markdown subset: headings, lists, quotes, rules, paragraphs.
function md(text) {
  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const block of text.replace(/\r/g, "").split(/\n{2,}/)) {
    for (const line of block.split("\n")) {
      let m;
      if (!line.trim()) continue;
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { closeList(); const n = Math.min(5, m[1].length + 2); out.push(`<h${n}>${inline(m[2])}</h${n}>`); }
      else if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { closeList(); out.push("<hr>"); }
      else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
      else if ((m = line.match(/^>\s?(.*)$/))) { closeList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
      else { closeList(); out.push(`<p>${inline(line)}</p>`); }
    }
    closeList();
  }
  return out.join("");
}

/* ---------- paper pane ---------- */

function drawPaper() {
  const pages = $("pages");
  pages.innerHTML = "";
  view.paper.pages.forEach((pg, i) => {
    const n = i + 1;
    const el = document.createElement("div");
    el.className = "page";
    el.id = `page-${n}`;
    el.style.aspectRatio = `${pg.width} / ${pg.height}`;
    el.innerHTML = `<img src="/page/${n}.png" loading="lazy" alt="Page ${n}">`;
    // Everything the reviewer wrote: sticky notes, text boxes, and comments attached to a highlight.
    const notes = view.paper.annotations.filter((a) => a.page === n && a.note);
    for (const a of notes) {
      const b = document.createElement("span");
      b.className = a.text == null ? "badge" : "badge over";   // only a mark on text carries its words
      b.textContent = a.id;
      b.dataset.tip = a.note;
      b.dataset.tipHead = a.id;
      b.dataset.tipColour = a.hex || "";
      b.dataset.ref = `ann:${a.id}`;
      b.style.left = `${(a.bbox[0] / pg.width) * 100}%`;
      b.style.top = `${(a.bbox[1] / pg.height) * 100}%`;
      el.appendChild(b);
    }
    pages.appendChild(el);
    const list = document.createElement("div");
    list.className = "pagenotes";
    // The swatch is the annotation's own colour, as it is in the PDF.
    const swatch = (a) => (/^#[0-9a-f]{6}$/i.test(a.hex || "") ? `<i class="dot" style="background:${a.hex}"></i>` : "");
    const place = (a) => (a.lines ? "L" + a.lines[0] : esc(a.anchor || ""));
    list.innerHTML = `<div class="label">Page ${n}${notes.length ? "" : `<span class="sub"> · no notes</span>`}</div>` + notes.map((a) =>
      `<div class="note" data-ref="ann:${a.id}"><b>${a.id}</b>${place(a) ? `<span class="tag">${place(a)}</span>` : "<span></span>"}<span class="tag">${swatch(a)}${esc(a.colour)}</span><span class="text">${esc(a.note)}</span></div>`
    ).join("");
    pages.appendChild(list);
  });
  markPage();
}

// The page at the top third of the paper pane, for the bar above it.
function markPage() {
  if (!view) return;
  const pane = $("paperScroll"), at = pane.scrollTop + pane.clientHeight / 3;
  let n = 1;
  document.querySelectorAll(".page").forEach((el, i) => { if (el.offsetTop <= at) n = i + 1; });
  $("pageNow").textContent = `Page ${n} of ${view.paper.pages.length}`;
}

function showBox(page, x0, y0, x1, y1) {
  const el = $(`page-${page}`);
  if (!el) return;
  const pg = view.paper.pages[page - 1];
  const right = $("paperScroll");   // positioned, so a page's offsetTop is measured from it
  const top = el.offsetTop + (y0 / pg.height) * el.clientHeight - right.clientHeight * 0.3;
  right.scrollTo({top: Math.max(0, top), behavior: "smooth"});
  const pad = 4;
  const f = document.createElement("div");
  f.className = "flash";
  f.style.left = `${((x0 - pad) / pg.width) * 100}%`;
  f.style.top = `${((y0 - pad) / pg.height) * 100}%`;
  f.style.width = `${((x1 - x0 + 2 * pad) / pg.width) * 100}%`;
  f.style.height = `${((y1 - y0 + 2 * pad) / pg.height) * 100}%`;
  el.appendChild(f);
  setTimeout(() => f.remove(), 2500);
}

function follow(ref) {
  const [type, a, b] = ref.split(":");
  if (type === "ann") {
    const ann = view.paper.annotations.find((x) => x.id === a);
    if (ann) showBox(ann.page, ...ann.bbox);
  } else if (type === "line") {
    const first = view.paper.lines[a], last = view.paper.lines[b] || first;
    if (!first) return;
    if (last[0] === first[0] && last[4] > first[2] && Math.abs(last[1] - first[1]) < 150)
      showBox(first[0], Math.min(first[1], last[1]), first[2], Math.max(first[3], last[3]), last[4]);
    else showBox(...first);
  } else if (type === "anchor") {
    const box = view.paper.anchors[ref.slice(7)];
    if (box) showBox(...box);
  } else if (type === "page") {
    const pg = view.paper.pages[+a - 1];
    if (pg) showBox(+a, 0, 0, pg.width, 40);
  }
}

// The section a spot of the paper sits in: the last numbered heading before it, reading down each
// column in turn. Empty if no heading comes before it.
function sectionAt(page, x, y) {
  const order = (p, px, py) => p * 1e6 + (px < view.paper.pages[p - 1].width / 2 ? 0 : 1e5) + py;
  const here = order(page, x, y) + 1;
  let best = "", bestAt = -1;
  for (const [name, box] of Object.entries(view.paper.anchors)) {
    if (!/^(section|appendix) /.test(name)) continue;
    const at = order(box[0], box[1], box[2]);
    if (at <= here && at > bestAt) { best = name; bestAt = at; }
  }
  if (!best) return "";
  const [kind, label] = best.split(" ");
  return `${kind[0].toUpperCase()}${kind.slice(1)} ${label.toUpperCase()}`;
}

// Where an entry's notes sit in the paper, as references the reviewer can take as its location.
function placesOf(e) {
  const out = [];
  for (const id of e.sources || []) {
    const a = view.paper.annotations.find((x) => x.id === id);
    if (!a) continue;
    const float = /^(FIGURE|TABLE) (\S+)$/.exec(a.anchor || "");
    if (float && view.paper.anchors[`${float[1]} ${float[2]}`.toLowerCase()]) out.push(`${float[1][0]}${float[1].slice(1).toLowerCase()} ${float[2]}`);
    const line = a.lines && view.paper.lines[a.lines[0]];
    const section = line ? sectionAt(line[0], line[1], line[2]) : sectionAt(a.page, a.bbox[0], a.bbox[1]);
    if (section) out.push(section);
    if (line) out.push(`L${a.lines[0]}`);
  }
  return [...new Set(out)].slice(0, 5);
}

/* ---------- rail ---------- */

function drawRail() {
  const s = view.session, now = stepAt(stepNow());
  $("flow").innerHTML = STEPS.map(([k, name], i) => {
    const mark = `<span class="mark">${i < now || (k === "final" && s.final) ? "✓" : i === now ? "●" : ""}</span>`;
    return i > now ? `<span class="step later">${mark}${name}</span>`
      : `<a href="#" class="step${i === now ? " current" : ""}${k === sel ? " sel" : ""}" data-step="${k}">${mark}${name}</a>`;
  }).join("");
  // A candidate that has not been written out yet is not flagged; the order is set with the arrows.
  const arrows = (e) => (e.dropped || e.kind === "observation" || live(e.kind).length < 2 ? ""
    : `<span class="arrows"><span data-shift="-1" data-id="${e.id}" title="Move up">↑</span><span data-shift="1" data-id="${e.id}" title="Move down">↓</span></span>`);
  const row = (e) => `<a href="#" class="irow${e.id === openId ? " sel" : ""}" data-entry="${e.id}"><b>${e.id}</b><span>${esc(e.claim || "")}${e.kind === "observation" ? ` ${CLAUDES}` : ""}${needs(e) && (e.body || countered(e)) ? ` <span class="flag">${needs(e)}</span>` : ""}</span>${arrows(e)}</a>`;
  const group = (label, list, sub = "") => `<div class="label">${label}${sub ? `<span class="sub"> · ${sub}</span>` : ""}</div>${list.map(row).join("") || `<div class="hint">none yet</div>`}`;
  const order = live("weakness").length > 1 ? (s.ranked ? "most severe first" : "not ordered yet") : "";
  const dropped = entries().filter((e) => e.dropped);
  // The same order as the review form: summary, strengths, weaknesses, comments.
  const summary = `<div class="label">Summary</div>` + (s.summary.trim() && now >= stepAt("summary")
    ? `<a href="#" class="irow${sel === "summary" && !openId ? " sel" : ""}" data-step="summary"><b></b><span>${esc(clip(s.summary.trim(), 70))}</span></a>`
    : `<div class="hint">not written yet</div>`);
  $("index").innerHTML = summary + group("Strengths", live("strength")) + group("Weaknesses", live("weakness"), order) + group("Comments", live("comment"))
    + (live("observation").length ? group("Claude's observations", live("observation")) : "")
    + (dropped.length ? fold("dropped", `Dropped (${dropped.length})`, dropped.map(row).join(""), "") : "");
}

/* ---------- cards ---------- */

// One entry as it stands in the index, worded as it will appear in the review. A click opens it.
function bulletRow(id) {
  const e = entryOf(id);
  if (!e) return "";
  return `<div class="bullet${e.dropped ? " dropped" : ""}" data-entry="${e.id}"><b>${e.id}</b><span>${inline(e.bullet || e.claim || "")}${
    e.dropped ? ` <span class="tag">dropped</span>` : ""}${needs(e) && (e.body || e.text || countered(e)) ? ` <span class="flag">${needs(e)}</span>` : ""}</span></div>`;
}

const idTag = (a) => (a.id ? `<b>${inline(a.id)}</b> ${(entryOf(a.id) || {}).kind === "observation" ? CLAUDES + " " : ""}` : "");

// The register entry behind a bias question, with where it comes from. Shown only on request.
function why(a, key) {
  if (!a.register) return "";
  const r = view.paper.register[a.register];
  if (!r) return fold(`${key}-why`, "Why is this asked?", `<p>Register entry ${esc(a.register)}.</p>`);
  const sources = (r.sources || []).map((x) => (/^https?:\/\//.test(x.url || "")
    ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>` : esc(x.label))).join("; ");
  return fold(`${key}-why`, "Why is this asked?", `<p><b>${esc(a.register)}: ${esc(r.title)}.</b> ${esc(r.how || "")}</p>
    ${r.signal ? `<p>What set it off: ${esc(r.signal)}</p>` : ""}
    <p>Source: ${sources || "your bias register"} <span class="hint">(entry ${esc(a.register)} in reviewing/BIASES.md)</span></p>`);
}

// One thing the reviewer is asked. Once it is settled, only the question and what became of it stay.
function askBlock(a, n, key, settled = "") {
  const paper = (a.paper ? md(a.paper) : "") + (a.guide ? `<p class="hint">A complete answer covers: ${inline(a.guide)}</p>` : "");
  const behind = settled ? "" : `${a.notes ? `<div class="notes"><div class="label">From your notes</div>${md(a.notes)}</div>` : ""}
    ${paper ? fold(`${key}-paper`, "From the paper", paper) : ""}${why(a, key)}`;
  return `<div class="ask${settled ? " done" : ""}"><span class="num">${n + 1}</span><div><div class="q">${idTag(a)}${inline(a.question)}${
    settled ? ` <span class="tag">${esc(settled)}</span>` : ""}</div>${behind}</div></div>`;
}

const asksOf = (f, key, settled = () => "") => (f.asks || []).map((a, n) => askBlock(a, n, `${key}-${n}`, settled(a))).join("");
const filed = (f) => (f.message ? `<div class="hint">${md(f.message)}</div>` : "");
const planRows = (f) => `<ul class="plan">${(f.plan || []).map((p) =>
  `<li><b>${/^\d+$/.test(p.target) ? "Sentence " + p.target : inline(p.target)}</b> <span class="tag">${esc(p.action || "")}</span>${p.point ? ` ${inline(p.point)}` : ""}${p.because ? ` <span class="hint">“${inline(p.because)}”</span>` : ""}</li>`).join("")}</ul>`;
const changes = (f) => ((f.plan || []).length ? `<div class="label">What changed</div>${planRows(f)}` : "");
// What was filed from free talk, and a plan that has not been written out: neither changed any text.
const filedCard = (f) => `<div class="card claude"><div class="head"><b>Filed</b><span>from what you said; no text was changed</span></div>${md(f.message || "")}${(f.entries || []).map((p) => bulletRow(p.id)).join("")}</div>`;
const planCard = (f) => `<div class="card claude" id="planCard"><div class="head"><b>Plan</b><span>nothing is changed yet</span></div>${planRows(f)}${filed(f)}</div>`;

// A message of Claude's as it was sent, for the exchange behind a step.
function claudeCard(t, i) {
  const f = t.fields;
  const name = {brief: "Overview", filed: "Filed", plan: "Plan", outline: (f.plan || []).length ? "Revised outline" : "Outline", summary: "Proposed summary", end: "Interview finished"}[f.kind]
    || (f.follow_up ? "Follow-up question" : "Question");
  const head = `<b>${name}</b>` + (f.sources || []).map((s) => `<a href="#" class="tag" data-ref="ann:${esc(s)}">${esc(s)}</a>`).join("");
  const sentences = (f.sentences || []).length ? `<ol>${f.sentences.map((s) => `<li>${inline(s.text)}</li>`).join("")}</ol>` : "";
  const bullets = f.kind === "outline" ? (f.entries || []).map((p) => bulletRow(p.id)).join("") : "";
  // Sessions from the earlier version list their points as items.
  const items = (f.items || []).length ? `<ul>${f.items.map((it) => `<li><b>${esc(it.id)}</b> ${inline(it.text)}</li>`).join("")}</ul>` : "";
  return `<div class="card claude"><div class="head">${head}</div>${asksOf(f, `t${i}`)}${md(f.message || "")}${sentences}${bullets}${items}${changes(f)}</div>`;
}

function reviewerCard(t) {
  const tags = [(!t.text && EMPTY_TAG[t.kind]) || TURN_TAG[t.kind] || t.kind, t.action, ...Object.entries(t.decisions || {}).map(([k, v]) => `${k} ${v}`)]
    .filter(Boolean).map((x) => `<span class="tag">${esc(x.replace(/_/g, " "))}</span>`).join("");
  return tags || t.text ? `<div class="card mine"><div class="head">${tags}</div>${linkify(esc(t.text || ""))}</div>` : "";
}

const card = (t, i) => (t.role === "claude" ? claudeCard(t, i) : reviewerCard(t));
const copyBtn = (text, label) => { copyables.push(text); return `<button class="small" data-copy="${copyables.length - 1}">${label}</button>`; };
// The messages of a step, each with its place in the record.
const turnsOf = (step) => view.session.turns.map((t, i) => [t, i]).filter(([t]) => (t.section === "new" ? "brief" : t.section) === step);

// The step that is open, as it stands now: what is asked, or the section as it will appear.
// Earlier messages are not repeated here; they are in the exchange, folded away below.
function nowCards(step) {
  const s = view.session, all = turnsOf(step).filter(([t]) => t.role === "claude");
  if (!all.length) return "";
  // The last thing filed, or a plan still on the table, sits under the step as it stands.
  const tail = all[all.length - 1][0].fields;
  const extra = tail.kind === "filed" ? filedCard(tail) : tail.kind === "plan" ? planCard(tail) : "";
  const claude = all.filter(([t]) => t.fields.kind !== "filed" && t.fields.kind !== "plan");
  if (!claude.length) return extra;
  const [last, at] = claude[claude.length - 1], f = last.fields;
  if (step === "brief") return claudeCard(last, at) + extra;
  if (!SECTIONS.includes(step)) return ((f.plan || []).length ? `<div class="card claude">${changes(f)}${filed(f)}</div>` : "") + extra;
  const asked = claude.findLast(([t]) => t.fields.kind === "question");
  if (s.phase === "ask") {
    // The questions stay in view. A change made to one entry meanwhile is reported under them.
    const q = asked ? `<div class="card claude">${asked[0].fields.follow_up ? `<div class="head"><b>One more question</b></div>` : ""}${
      asksOf(asked[0].fields, `t${asked[1]}`) || md(asked[0].fields.message || "")}${(asked[0].fields.asks || []).length ? filed(asked[0].fields) : ""}</div>` : "";
    return q + (asked && last !== asked[0] && (f.plan || []).length ? `<div class="card claude">${changes(f)}${filed(f)}</div>` : "") + extra;
  }
  const kind = SECTION_KIND[step];
  if (step === "summary") return `<div class="card claude"><div class="head"><b>Summary</b><span>written from the paper's own account of itself</span><span id="wc"></span></div>
    <textarea id="para"></textarea><div id="sents" class="hint"></div>${changes(f)}${filed(f)}</div>` + extra;
  if (kind) return `<div class="card claude"><div class="head"><b>${STEP_NAME[step]} as they stand</b><span>click one to edit it</span></div>
    ${[...live(kind), ...(step === "weaknesses" ? live("observation") : [])].map((e) => bulletRow(e.id)).join("") || `<span class="hint">None.</span>`}
    ${asksOf(f, `t${at}`)}${changes(f)}${filed(f)}</div>` + extra;
  // The bias test: its questions stay in view, each marked once the reviewer's answer has settled it.
  const plans = claude.filter(([, i]) => asked && i > asked[1]).flatMap(([t]) => t.fields.plan || []);
  const settled = (a) => (a.id ? (plans.findLast((p) => p.target.toUpperCase() === a.id.toUpperCase()) || {}).action || "" : s.ranked ? "ordered" : "");
  const asks = asked ? asked[0].fields.asks || [] : [];
  const open = asks.filter((a) => !settled(a)).length;
  return `<div class="card claude"><div class="head"><b>Bias test</b><span>${asks.length ? `${asks.length - open} of ${asks.length} settled` : "no questions"}</span></div>
    ${asked ? asksOf(asked[0].fields, `t${asked[1]}`, settled) : ""}${last !== (asked || [])[0] ? asksOf(f, `t${at}`) + changes(f) + filed(f) : filed(f)}</div>` + extra;
}

// What a finished section put into the review. It stays open to hand edits.
function resultCard(step) {
  if (step === "summary") return `<div class="card"><div class="head"><b>Summary in the review</b><span id="wc"></span></div>
    <textarea id="para"></textarea><div class="row" style="margin-top:8px"><button class="small" id="saveSummary">Save</button></div></div>`;
  const kind = SECTION_KIND[step];
  return kind ? `<div class="card"><div class="head"><b>${STEP_NAME[step]} in the review</b><span>click one to edit it</span></div>
    ${live(kind).map((e) => bulletRow(e.id)).join("") || `<span class="hint">None.</span>`}</div>` : "";
}

// The exchange behind a step: every message as it was sent. Folded away; the record holds it too.
function exchange(step) {
  const turns = turnsOf(step).filter(([t]) => t.role !== "claude" || t.fields.kind !== "brief");
  const cards = turns.map(([t, i]) => card(t, i)).filter(Boolean);
  return cards.length ? fold(`exchange-${step}`, `The exchange so far (${cards.length} ${cards.length === 1 ? "message" : "messages"})`, cards.join(""), "history") : "";
}

// The draft: one block per form field, each with a button that copies its Markdown source.
function draftCards() {
  if (!view.session.draft) return "";
  const [review, trace] = splitDraft(view.session.draft);
  const fields = review.split(/^## /m);
  const title = fields.shift().replace(/^#\s*/, "").trim();
  let body = "";
  for (const field of fields) {
    const nl = field.indexOf("\n");
    const name = (nl < 0 ? field : field.slice(0, nl)).trim();
    const text = nl < 0 ? "" : field.slice(nl + 1).trim();
    body += `<div class="field"><div class="fieldhead"><b>${esc(name)}</b>${copyBtn(text, "Copy Markdown")}</div>${md(text)}</div>`;
  }
  return `<div class="card" id="draftCard"><div class="head"><b>Draft review</b><span>${esc(title)}</span>${copyBtn(review, "Copy whole review")}</div>${body || md(review)}</div>`
    + (trace ? `<div class="card">${fold("trace", "For you only: where each point came from", `<div class="row" style="margin:8px 0">${copyBtn(trace, "Copy Markdown")}</div>${md(trace)}`, "")}</div>` : "");
}

// The last step: the review as it went into the form, kept as an example for later reviews.
function finalCard() {
  const s = view.session;
  const reminders = (view.paper.score_reminders || []).map((r) => `<p><b>${esc(r.title)}.</b> ${esc(r.question)}</p>`).join("");
  const state = s.final ? `<span class="saved">✓ Saved as submitted${s.final_at ? ` at ${esc(s.final_at)}` : ""}</span>`
    : `<span class="hint">Paste the review as it went into the form, then save it.</span>`;
  const kept = s.final && s.example ? `<div class="hint">A copy is kept as an example for later reviews: <code>${esc(s.example)}</code></div>` : "";
  const same = s.final && s.final_unchanged ? `<div class="callout" style="margin-top:8px">This is the draft, unchanged. If you edited the review in the form, paste the submitted text here and save again.</div>` : "";
  return `<div class="card"><div class="head"><b>After you submit</b><span>the review as it went into the form</span></div>
    <textarea id="finalText" style="min-height:220px"></textarea>
    ${reminders ? `<details class="front" open style="margin-top:8px"><summary>When you set your scores</summary>${reminders}</details>` : ""}
    <div class="row" style="margin-top:8px"><button class="primary" id="finalBtn">Save as submitted</button>${state}</div>${kept}${same}</div>`;
}

// The top of the last step: the review is done, where it is, and what to do with it.
function doneCard() {
  return `<div class="card"><div class="head"><b>Your review is drafted and saved</b></div>
    <p>It is in <code>${esc(view.files.review_text)}</code>. Copy each section into the review form with its button, set your scores there and submit.</p>
    <p class="hint">To change anything, click a point, or say it in the box below: reword, reorder, move or drop, in any section. The draft follows every change.</p></div>`;
}

// The check against the guidelines: one finding for each thing not met, with a way to act on it.
function checkCard() {
  const s = view.session;
  if (!s.check) return "";
  const body = !(s.findings || []).length ? md(s.check) : s.findings.map((f, n) => {
    const e = entryOf(f.target.toUpperCase()), summary = /^summary$/i.test(f.target);
    const basis = [...(f.sources || []).map((x) => `<a href="#" class="tag" data-ref="ann:${esc(x)}">${esc(x)}</a>`),
      f.where ? `<span class="hint">${inline(f.where)}</span>` : ""].join(" ");
    const buttons = f.status ? `<span class="tag">${f.status === "used" ? "taken" : "set aside"}</span>`
      : `${f.suggestion && (e || summary) ? `<button class="small" data-finding="${n}" data-v="use">Use this</button>` : ""}
        ${e ? `<button class="small" data-entry="${e.id}">Edit ${e.id}</button>` : summary ? `<button class="small" data-step="summary">Edit the summary</button>` : ""}
        <button class="small" data-finding="${n}" data-v="dismiss">Set aside</button>`;
    return `<div class="finding${f.status ? " done" : ""}"><div><b>${inline(f.target)}</b> ${f.kind === "fact" ? `<span class="flag">the paper says otherwise</span> ` : ""}${inline(f.problem)}</div>
      ${f.suggestion && !f.status ? fold(`finding-${n}`, "Suggested rewording, from your notes", `<div class="suggest">${md(f.suggestion)}</div>${basis.trim() ? `<div class="row">${basis}</div>` : ""}`) : ""}
      <div class="row">${buttons}</div></div>`;
  }).join("");
  return `<div class="card" id="checkCard"><div class="head"><b>Check against your guidelines</b>${copyBtn(s.check, "Copy Markdown")}</div>${body}</div>`;
}

// The open entry: its text as it will appear in the review, which the reviewer edits directly,
// then what it rests on. The parts the text was built from are folded away.
function editorCard() {
  const e = entryOf(openId), lacks = e.dropped ? [] : (e.gaps || []).filter((g) => GAPS[g]);
  const note = (id) => {
    const a = view.paper.annotations.find((x) => x.id === id) || {}, under = a.text || a.anchor;
    return `<div class="src"><a href="#" class="tag" data-ref="ann:${esc(id)}">${esc(id)}</a><div>${esc(a.note || "")}${
      under ? `<div class="under">“${esc(clip(under, 200))}”</div>` : ""}</div></div>`;
  };
  const places = lacks.includes("where") ? placesOf(e) : [];
  const still = e.dropped ? `<div class="hint">Dropped: it is left out of the review.</div>` : !lacks.length ? "" : `<div class="still">${
    lacks.includes("where") ? `No location yet.${places.length ? " Take one from your notes: " + places.map((p) => `<button class="small" data-place="${esc(p)}">${esc(p)}</button>`).join(" ") : ""} ` : ""}${
    lacks.includes("resolve") ? "No fix yet: say or write what would resolve it." : ""}</div>`;
  const fields = PARTS[e.kind].map(([k, label]) => {
    const v = esc(e[k] || "");
    const input = k === "claim" ? `<input type="text" data-part="claim" value="${v}">`
      : k === "where" ? `<input type="text" data-part="where" value="${v}" placeholder="e.g. Table 2; L425–427">
        <label class="hint"><input type="checkbox" data-part="nowhere"${e.nowhere ? " checked" : ""}> No single location</label>`
      : `<textarea data-part="${k}" rows="3">${v}</textarea>`;
    return `<div class="part"><div class="label">${label}</div>${input}</div>`;
  }).join("");
  // A fact from the paper that cuts against the point stays here until the reviewer settles it.
  const counter = !e.counter || e.dropped ? "" : e.counter_settled
    ? `<div class="hint">The paper says: ${inline(e.counter)} <span class="tag">settled</span> <a href="#" data-counter="open">Open it again</a></div>`
    : `<div class="still"><b>The paper says:</b> ${inline(e.counter)}<br>Reword the point, by hand or by saying it below. If it stands as it is, settle it. <button class="small" data-counter="settled">Settled</button></div>`;
  const own = e.text ? `<div class="hint">This is your own wording, so the parts no longer change it. <a href="#" data-rebuild>Build it from the parts again</a></div>` : "";
  return `<div class="card"><textarea id="entryText" data-part="text" placeholder="The point as it will appear in the review">${esc(e.wording || "")}</textarea>
    ${own}${counter}${still}
    ${(e.sources || []).length ? `<div class="label">From your notes</div>${e.sources.map(note).join("")}` : ""}
    ${(e.remarks || []).length ? `<div class="label">What you said about it</div>${e.remarks.map((r) => `<div>“${esc(r)}”</div>`).join("")}` : ""}
    ${e.said ? `<div class="label">Your words</div><div>“${esc(e.said)}”${e.said_ok === false ? ` <span class="flag">not found word for word in your answers</span>` : ""}</div>` : ""}
    ${(e.was || []).length ? `<div class="hint">Was ${esc(e.was.join(", "))}.</div>` : ""}
    ${fold(`parts-${e.id}`, "Parts", fields)}</div>`;
}

/* ---------- middle pane ---------- */

function drawLog() {
  const s = view.session;
  copyables = [];
  const past = stepAt(sel) < stepAt(stepNow());
  const parts = s.legacy ? [...s.turns.map(card), draftCards(), checkCard()]
    : openId ? [editorCard()]
    : [past && sel !== "brief" ? resultCard(sel) : nowCards(sel),
       sel === "draft" ? checkCard() : "", sel === "final" ? doneCard() + draftCards() + checkCard() + finalCard() : "", exchange(sel)];
  $("log").innerHTML = parts.join("");
  editable("para", "summary", s.summary);
  editable("finalText", "final", s.final || splitDraft(s.draft)[0]);
  const fb = $("finalBtn"), ft = $("finalText");
  if (fb) {
    // Saved once is saved: the button comes back when the text changes.
    const mark = () => { fb.disabled = !!s.final && ft.value === s.final; };
    mark();
    ft.addEventListener("input", mark);
    fb.onclick = () => post("/api/final", {text: ft.value});
  }
  if ($("saveSummary")) $("saveSummary").onclick = () => post("/api/summary", {text: $("para").value});
}

// A text box that starts from the saved text and keeps the reviewer's edits until they are saved.
function editable(id, key, saved) {
  const box = $(id);
  if (!box) return;
  box.value = edits[key] ?? saved;
  const count = () => {
    if ($("wc")) $("wc").textContent = `${box.value.trim().split(/\s+/).filter(Boolean).length} words`;
    // The summary one numbered sentence to a line, so "the third" can be seen and said.
    const list = id === "para" && $("sents") ? box.value.trim().split(/(?<=[.!?])\s+/).filter(Boolean) : [];
    if ($("sents")) $("sents").innerHTML = list.length > 1 ? `<div class="label">Sentence by sentence</div><ol>${list.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>` : "";
  };
  count();
  box.oninput = () => { edits[key] = box.value; count(); };
}

// A text box is as tall as its text, up to a share of the window, so the text is read without scrolling inside it.
function grow(box) {
  if (!box.offsetParent) return;   // folded away: sized when it is opened
  box.style.height = "auto";
  box.style.height = `${Math.min(box.scrollHeight + 2, innerHeight * (box.id === "say" ? 0.4 : 0.6))}px`;
}
const growAll = (within) => within.querySelectorAll("textarea").forEach(grow);

// The box the reviewer talks or types into, with dictation and the buttons that send it.
function sayBox(placeholder, buttons) {
  const supported = window.SpeechRecognition || window.webkitSpeechRecognition;
  return `<textarea id="say" placeholder="${placeholder}"></textarea>
    <div class="row">${supported ? `<button id="mic" title="Dictate into the text box you last clicked in">🎙 Dictate</button>` : ""}<span class="hint" id="micHint"></span>${buttons}</div>`;
}
// One main button per state: Revise is the main one when nothing else on the screen can be.
// "Plan it first" asks for the plan alone, to be talked over before any text is rewritten.
const changeBox = (placeholder, main) => sayBox(placeholder, `<button id="planBtn" title="See the plan, sentence by sentence or point by point, before anything is rewritten">Plan it first</button>
  <button${main ? ` class="primary"` : ""} id="sendBtn">Revise</button>`);

// The entries the open question is about, each with the buttons for its kind.
function candidates() {
  // From every question of the open section, so a follow-up does not hide them.
  const kind = SECTION_KIND[view.session.stage];
  const asked = view.session.turns.filter((t) => t.role === "claude" && t.section === view.session.stage && t.fields.kind === "question")
    .flatMap((t) => [...(t.fields.entries || []), ...(t.fields.asks || [])]);
  // And the points of this kind that were filed from free talk, before or since.
  asked.push(...entries().filter((e) => e.kind === kind || (kind === "weakness" && e.kind === "observation")).map((e) => ({id: e.id})));
  const seen = new Set();
  const rows = asked.map((x) => {
    const e = x.id && entryOf(x.id);
    if (!e || seen.has(e.id)) return "";
    seen.add(e.id);
    // A weakness or an observation can also become a comment; the choices stay the same after it has moved.
    const three = /^[WO]/.test(x.id);
    const state = e.dropped ? "drop" : three ? e.kind : "keep";
    const buttons = (three ? [["weakness", "Weakness"], ["comment", "Comment"], ["drop", "Drop"]] : [["keep", "Keep"], ["drop", "Drop"]]).map(([v, label]) =>
      `<button class="small${state === v ? " on" : ""}" data-pick="${e.id}" data-v="${v}">${label}</button>`).join("");
    const more = e.kind === "observation" ? ` ${CLAUDES} <span class="hint">${inline(`${e.body || ""}${e.where ? ` (${e.where})` : ""}`)}</span>` : "";
    return `<div class="obs"><div class="text"><b>${inline(e.id)}</b> <span class="claim" data-claim="${e.id}" title="Click to reword">${esc(e.claim || "")}</span>${more}</div>${buttons}</div>`;
  }).join("");
  return rows ? `<div class="points">${rows}</div>` : "";
}

function pick(id, v) {
  const e = entryOf(id), body = {id: e.id, dropped: v === "drop"};
  if (v !== "drop" && v !== "keep" && v !== e.kind) body.move = v;
  post("/api/entry", body);
}

// Clicking a claim beside its buttons makes it editable in place.
function reword(span) {
  const e = entryOf(span.dataset.claim);
  const input = document.createElement("input");
  input.type = "text";
  input.value = e.claim || "";
  span.replaceWith(input);
  input.focus();
  input.onkeydown = (ev) => { if (ev.key === "Escape") input.value = e.claim || ""; if (ev.key === "Enter" || ev.key === "Escape") input.blur(); };
  input.onblur = () => { const v = input.value.trim(); if (v && v !== e.claim) post("/api/entry", {id: e.id, set: {claim: v}}); else drawComposer(); };
}

// What differs in the open entry from what is saved: its text and its parts.
function changed() {
  const e = entryOf(openId), set = {};
  document.querySelectorAll("#log [data-part]").forEach((el) => {
    const k = el.dataset.part, v = k === "nowhere" ? el.checked : el.value.trim();
    if (v !== (k === "nowhere" ? !!e.nowhere : k === "text" ? e.wording || "" : e[k] || "")) set[k] = v;
  });
  return set;
}

// A hand edit of the open entry. Unsaved changes go with every action, so none is lost.
function act(extra) {
  const set = Object.assign(changed(), extra.set), body = Object.assign({id: entryOf(openId).id}, extra);
  delete body.set;
  if (Object.keys(set).length) body.set = set;
  if (Object.keys(body).length > 1) post("/api/entry", body);
}

const reply = (body) => post("/api/reply", body, true);
const change = (prefix, extra, action = "change") => { if (unsent.trim()) reply({action, text: prefix + unsent, ...extra}); };
// Free talk: filed onto the points it belongs with. The step stays open.
const talk = () => { if (unsent.trim()) reply({action: "talk", text: unsent}); };

function drawComposer() {
  const c = $("composer"), s = view.session, step = stepNow();
  const err = errorText ? `<div class="error">${esc(errorText)}</div>` : "";
  const scrolled = (c.querySelector(".points") || {}).scrollTop;
  if (busySince) {
    c.innerHTML = `<div class="hint" id="busyLine">Claude is working…</div>`;
  } else if (s.legacy) {
    c.innerHTML = `<div class="hint">This interview was saved by an earlier version of Debrief and is read-only. Run with <code>--restart</code> to start a new one.</div>`;
  } else if (openId) {
    const e = entryOf(openId), peers = live(e.kind), at = peers.indexOf(e);
    const canSay = !view.pending && (s.phase === "ask" || s.phase === "outline" || step === "draft" || step === "final");
    const order = e.kind === "observation" ? "" : `<button class="small" id="upBtn" title="Move up${e.kind === "weakness" ? ": more severe" : ""}"${at < 1 ? " disabled" : ""}>↑</button>
      <button class="small" id="downBtn" title="Move down${e.kind === "weakness" ? ": less severe" : ""}"${at < 0 || at === peers.length - 1 ? " disabled" : ""}>↓</button>`;
    c.innerHTML = `${err}<div class="row"><button class="primary" id="saveBtn">Save</button>${order}
      <select id="moveSel"><option value="">Move to…</option>${KINDS.filter(([k]) => k !== e.kind).map(([k, name]) => `<option value="${k}">${name}</option>`).join("")}</select>
      <span class="spacer"></span><button id="dropBtn">${e.dropped ? "Restore" : "Drop"}</button></div>
      ${canSay ? changeBox(`Or say what to change in ${e.id}, and Claude rewrites it`) : ""}`;
    $("saveBtn").onclick = () => act({});
    if (order) { $("upBtn").onclick = () => act({shift: -1}); $("downBtn").onclick = () => act({shift: 1}); }
    $("moveSel").onchange = (ev) => act({move: ev.target.value});
    $("dropBtn").onclick = () => act({dropped: !e.dropped});
    if (canSay) { $("sendBtn").onclick = () => change(`${e.id}: `); $("planBtn").onclick = () => change(`${e.id}: `, {}, "plan"); }
  } else if (sel !== step) {
    c.innerHTML = `<div class="hint">This step is finished. The interview is at <a href="#" data-step="${step}">${STEP_NAME[step]}</a>.</div>`;
  } else if (view.pending) {
    c.innerHTML = `${err}<div class="hint">Your last answer is saved, but Claude has not replied to it (the call failed or was interrupted).</div>
      <div class="row"><button class="primary" id="retryBtn">Ask Claude again</button></div>`;
    $("retryBtn").onclick = () => post("/api/retry", {});
  } else if (s.stage === "new") {
    c.innerHTML = `${err}<div class="hint">${view.paper.counts.notes} notes and ${view.paper.counts.highlights} highlights found. Claude will read the paper and your notes and come back with a brief. This takes a minute or two.</div>
      <div class="callout"><div class="label">Before you start</div>This sends the whole paper and your notes to the model. A submission under review is confidential: continue only if your model setup is privacy-preserving and your venue allows this use.</div>
      <div class="row"><button class="primary" id="startBtn">Prepare the interview</button></div>`;
    $("startBtn").onclick = () => post("/api/start", {});
  } else if (step === "brief") {
    c.innerHTML = err + sayBox("Talk it through: anything on your mind about the paper, in any order. It is filed onto your points.",
      `<button id="fileBtn">File this</button><button class="primary" id="sendBtn">Go on to the summary</button>`);
    $("fileBtn").onclick = talk;
    $("sendBtn").onclick = () => { if (!unsent.trim() || confirm("What is in the box has not been filed. Go on without it?")) reply({text: ""}); };
  } else if (s.phase === "ask") {
    const fm = view.paper.front_matter;
    const front = step === "summary" ? `<details class="front"><summary>From the paper: abstract, contributions, conclusion</summary>
      <h5>Abstract</h5><p>${esc(fm.abstract)}</p><h5>Contributions</h5><p>${esc(fm.contributions)}</p><h5>Conclusion</h5><p>${esc(fm.conclusion)}</p></details>` : "";
    c.innerHTML = err + front + candidates() + sayBox("Your answer, in your words. A thought about something else can be filed without answering.",
      `<button class="small" id="skipBtn">Skip this section</button><button id="fileBtn">File a thought</button><button class="primary" id="sendBtn">Send answer</button>`);
    $("fileBtn").onclick = talk;
    $("sendBtn").onclick = () => reply({text: unsent});
    $("skipBtn").onclick = () => { if (confirm(`Skip this section (${STEP_NAME[step]}) and move on?`)) reply({action: "skip"}); };
  } else if (s.phase === "outline") {
    // What is still open is named beside the button, and the reviewer may accept the section as it is.
    const open = openItems(step), soft = open.gaps.length > 0, name = STEP_NAME[step].toLowerCase(), planned = s.plan_open;
    c.innerHTML = `${err}${open.undecided.length ? open.html : ""}<div class="row">${planned ? `<button class="primary" id="applyBtn">Write it from this plan</button>` : ""}
      <button${open.undecided.length ? " disabled" : soft || planned ? "" : ` class="primary"`} id="acceptBtn">${soft ? `Accept ${name} anyway` : `Accept ${name}`}</button>
      ${soft && !open.undecided.length ? `<span class="hint">${inline(open.gaps.join(" "))}</span>` : ""}</div>
      ${changeBox(planned ? "Or say what to change in the plan" : step === "summary" ? "Say what to change or add, e.g. shorten it, or drop the third sentence" : "Or say what to change, or answer what is asked above", open.html !== "" && !planned)}`;
    // A change to the summary is made to the paragraph as it stands in the box, hand edits included.
    const box = () => (step === "summary" ? {summary: $("para").value} : {});
    $("acceptBtn").onclick = () => reply({action: "accept", ...(step === "summary" ? {text: $("para").value} : {}), ...(soft ? {force: true} : {})});
    if (planned) $("applyBtn").onclick = () => reply({action: "apply", ...box()});
    $("sendBtn").onclick = () => change("", box());
    $("planBtn").onclick = () => change("", box(), "plan");
  } else {
    // Draft and final: the draft is assembled by the server from the summary and the index.
    const open = openItems(step), drafted = step === "final", planned = s.plan_open;
    // The check runs by itself after the bias test. The draft does not wait for it.
    const checking = view.checking ? `<span class="hint">Checking against your guidelines… Its findings appear here. You can draft meanwhile.</span>` : "";
    const checkBtn = view.checking ? "" : `<button class="${s.check || planned ? "" : "primary"}" id="checkBtn">${s.check ? "Check again" : "Check against your guidelines"}</button>`;
    c.innerHTML = `${err}${open.html}${view.check_error ? `<div class="error">The check did not finish: ${esc(view.check_error)}</div>` : ""}
      ${drafted ? checking : `<div class="row">${checkBtn}
        <button class="${(s.check || view.checking) && !planned ? "primary" : ""}" id="draftBtn">${open.html ? "Draft anyway" : "Draft the review"}</button>${checking}</div>`}
      ${planned ? `<div class="row"><button class="primary" id="applyBtn">Write it from this plan</button></div>` : ""}
      ${changeBox(planned ? "Or say what to change in the plan" : "Talk about the review: say what to change, anywhere. E.g. soften W2, put C3 first, shorten the summary")}`;
    if (!drafted) $("draftBtn").onclick = () => post("/api/draft", open.html ? {force: true} : {});
    if ($("checkBtn")) $("checkBtn").onclick = () => post("/api/check", {});
    if (planned) $("applyBtn").onclick = () => reply({action: "apply"});
    $("sendBtn").onclick = () => change("");
    $("planBtn").onclick = () => change("", {}, "plan");
  }
  if (c.querySelector(".points")) c.querySelector(".points").scrollTop = scrolled || 0;
  const say = $("say");
  if (say) {
    say.value = unsent;
    say.oninput = () => { unsent = say.value; keepUnsent(); };
    // Cmd or Ctrl with Enter presses the main button: at the overview that is "File this" once there is text.
    const lead = () => { const f = $("fileBtn"); if (f && step === "brief") { f.classList.toggle("primary", !!unsent.trim()); $("sendBtn").classList.toggle("primary", !unsent.trim()); } };
    lead();
    say.addEventListener("input", lead);
    say.onkeydown = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); (c.querySelector("button.primary") || $("sendBtn")).click(); } };
    if (!openId) say.focus();
  }
  if ($("mic")) $("mic").onclick = toggleMic;
  growAll(c);
}

// Hand edits and the draft are answered at once; everything else waits for the model.
async function post(path, body, clear) {
  if (busy) return;
  stopMic();
  busy = true; errorText = "";
  if (!/entry|summary|draft|final|finding/.test(path)) { busySince = Date.now(); drawComposer(); }
  try {
    const res = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    view = data;
    if (clear) { unsent = ""; keepUnsent(); openId = null; sel = stepNow(); }
    if (clear || path === "/api/summary" || path === "/api/finding") delete edits.summary;
    if (path === "/api/final") delete edits.final;
    if (openId) openId = entryOf(openId).id;   // a moved entry has a new ID
  } catch (e) {
    // An answer is saved by the server before the model is asked, so reload to see what was stored.
    let stored = false;
    try { view = await (await fetch("/api/state")).json(); stored = clear && view.pending; } catch (_) {}
    if (stored) { unsent = ""; keepUnsent(); openId = null; sel = stepNow(); }
    errorText = stored || !clear ? e.message : `${e.message} Your text is still in the box.`;
  }
  busy = false; busySince = 0;
  draw();
}

setInterval(() => {
  const el = $("busyLine");
  if (el) el.textContent = `Claude is working… ${Math.round((Date.now() - busySince) / 1000)} s`;
}, 1000);

/* ---------- unsent text survives a reload ---------- */

const unsentKey = () => `interview-unsent:${view ? view.paper.name : ""}`;
function keepUnsent() { try { localStorage.setItem(unsentKey(), unsent); } catch (_) {} }
function recallUnsent() { try { return localStorage.getItem(unsentKey()) || ""; } catch (_) { return ""; } }

/* ---------- dictation: into the text box the reviewer last clicked in ---------- */

let recogniser = null;
let listening = false;
const micBox = () => document.querySelector(micSel) || $("say");
const micNote = (text) => { if ($("micHint")) $("micHint").textContent = text; };
function toggleMic() { listening ? stopMic() : startMic(); }
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recogniser = new SR();
  recogniser.continuous = true;
  recogniser.interimResults = true;
  recogniser.lang = "en-GB";
  recogniser.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const said = e.results[i][0].transcript, box = micBox();
      if (!e.results[i].isFinal) interim += said;
      else if (box) {
        box.value = (box.value && !/\s$/.test(box.value) ? box.value + " " : box.value) + said.trim();
        box.dispatchEvent(new Event("input", {bubbles: true}));   // kept and sized like typed text
        box.scrollTop = box.scrollHeight;
      }
    }
    micNote(interim ? `… ${interim}` : "Listening.");
  };
  recogniser.onerror = (e) => { micNote(`Dictation stopped: ${e.error}`); listening = false; markMic(); };
  recogniser.onend = () => { if (listening) { try { recogniser.start(); } catch (_) { listening = false; markMic(); } } };
  listening = true;
  recogniser.start();
  markMic();
  micNote("Listening.");
  track("dictate", {on: true, into: micSel});
}
function stopMic() {
  if (listening) track("dictate", {on: false});
  listening = false;
  if (recogniser) { try { recogniser.stop(); } catch (_) {} }
  markMic();
}
function markMic() {
  const b = $("mic");
  if (b) { b.classList.toggle("on", listening); b.textContent = listening ? "■ Stop dictation" : "🎙 Dictate"; }
  if (!listening && $("micHint") && $("micHint").textContent.startsWith("Listening")) micNote("");
}
document.addEventListener("focusin", (e) => {
  const t = e.target;
  if (!t.matches || !t.matches("#mid textarea, #mid input[type=text]")) return;
  micSel = t.id ? `#${t.id}` : t.dataset.part ? `#log [data-part="${t.dataset.part}"]` : "#say";
});

/* ---------- top level ---------- */

// Show a step, or an entry of the index, in the middle pane.
function go(step, id = null) {
  if (openId && !busySince && Object.keys(changed()).length) {
    const drop = confirm(`Discard your unsaved changes to ${openId}?`);
    track("discard", {entry: openId, discarded: drop});
    if (!drop) return;
  }
  stopMic();
  sel = step; openId = id; micSel = "#say";
  track("view", id ? {entry: id} : {step});
  draw();
}

// The left column: the bar on its edge is dragged to any width, or all the way left to put the column
// away. A click on the arrow does the same. The width and the choice are remembered.
const RAIL = {min: 180, max: 520, away: 110};
function setRail(hidden, keep, width) {
  const app = $("app"), g = $("grip");
  app.classList.toggle("norail", hidden);
  if (width) app.style.setProperty("--rail", `${width}px`);
  g.title = hidden ? "Show the steps and your points" : "Drag to resize. Drag to the left edge, or click the arrow, to put the column away";
  g.setAttribute("aria-label", g.title);
  $("gripTab").textContent = hidden ? "›" : "‹";
  if (!keep) return;
  try { localStorage.setItem("interview-rail", hidden ? "hidden" : "shown"); if (width) localStorage.setItem("interview-rail-width", String(width)); } catch (_) {}
  track("rail", {hidden, ...(width ? {width} : {})});
}
(() => {
  const g = $("grip");
  let drag = null;
  g.addEventListener("pointerdown", (e) => {
    drag = {x: e.clientX, moved: false, tab: !!e.target.closest("#gripTab")};
    try { g.setPointerCapture(e.pointerId); } catch (_) {}
    g.classList.add("drag");
    e.preventDefault();
  });
  g.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 4) drag.moved = true;
    if (!drag.moved) return;
    drag.width = Math.max(RAIL.min, Math.min(RAIL.max, Math.round(e.clientX)));
    const away = e.clientX < RAIL.away;
    setRail(away, false, away ? 0 : drag.width);
  });
  const end = () => {
    if (!drag) return;
    const away = $("app").classList.contains("norail");
    if (drag.moved) setRail(away, true, away ? 0 : drag.width);
    else if (drag.tab || away) setRail(!away, true);   // a click: on the arrow, or anywhere on the handle while the column is away
    g.classList.remove("drag");
    drag = null;
  };
  g.addEventListener("pointerup", end);
  g.addEventListener("pointercancel", end);
})();

// The hover card over a note badge, a note's ID or a point's ID.
(() => {
  const tip = $("tip");
  document.addEventListener("mouseover", (e) => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (!el || !el.dataset.tip) { tip.style.display = "none"; return; }
    tip.innerHTML = (el.dataset.tipHead ? `<b>${esc(el.dataset.tipHead)}</b>` : "") + esc(el.dataset.tip);
    const colour = el.dataset.tipColour || "";
    tip.style.background = /^#[0-9a-f]{6}$/i.test(colour) ? `color-mix(in srgb, ${colour} 55%, #fffdf2)` : "";
    tip.style.display = "block";
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, r.left))}px`;
    tip.style.top = `${r.bottom + h + 12 > innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8}px`;
  });
  document.addEventListener("scroll", () => { tip.style.display = "none"; }, true);
  document.addEventListener("mousedown", () => { tip.style.display = "none"; }, true);
})();

document.addEventListener("click", (e) => {
  const on = (q) => e.target.closest(q);
  let el;
  if ((el = on("[data-ref]"))) { e.preventDefault(); track("link", {to: el.dataset.ref.split(":")[0]}); follow(el.dataset.ref); }
  else if ((el = on("[data-copy]"))) copy(el);
  else if ((el = on("[data-counter]"))) { e.preventDefault(); act({counter: el.dataset.counter}); }
  else if ((el = on("[data-shift]"))) { e.preventDefault(); post("/api/entry", {id: el.dataset.id, shift: +el.dataset.shift}); }
  else if ((el = on("[data-pick]"))) pick(el.dataset.pick, el.dataset.v);
  else if ((el = on("[data-claim]"))) reword(el);
  else if ((el = on("[data-finding]"))) post("/api/finding", {n: +el.dataset.finding, action: el.dataset.v});
  else if ((el = on("[data-place]"))) act({set: {where: el.dataset.place}});
  else if ((el = on("[data-rebuild]"))) { e.preventDefault(); post("/api/entry", {id: entryOf(openId).id, set: {text: ""}}); }
  else if ((el = on("[data-entry]"))) { e.preventDefault(); go(sel, el.dataset.entry); }
  else if ((el = on("[data-step]"))) { e.preventDefault(); go(el.dataset.step); }
});
// A folded part the reviewer opens stays open when the pane is drawn again.
document.addEventListener("toggle", (e) => {
  const key = e.target.dataset && e.target.dataset.k;
  if (!key || unfolded.has(key) === e.target.open) return;
  e.target.open ? unfolded.add(key) : unfolded.delete(key);
  track("fold", {key: key.replace(/^t\d+-\d+-/, ""), open: e.target.open});
  if (e.target.open) growAll(e.target);
}, true);
document.addEventListener("input", (e) => { if (e.target.tagName === "TEXTAREA") grow(e.target); });
// In the open entry, Cmd or Ctrl with Enter saves it.
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && e.target.closest && e.target.closest("#log [data-part]")) { e.preventDefault(); act({}); }
});

async function copy(button) {
  const label = button.textContent;
  track("copy", {what: label});
  try { await navigator.clipboard.writeText(copyables[+button.dataset.copy]); button.textContent = "Copied"; }
  catch (_) { button.textContent = "Copy failed"; }
  setTimeout(() => { button.textContent = label; }, 1500);
}

function draw() {
  const s = view.session;
  if (!paperDrawn) { drawPaper(); paperDrawn = true; }
  if (s.stage !== stageSeen) { stageSeen = s.stage; sel = stepNow(); openId = null; }
  $("app").classList.toggle("legacy", !!s.legacy);
  $("paperName").textContent = view.paper.name;
  const e = openId && entryOf(openId);
  // The step and its number, so progress shows with the left column away.
  $("head").innerHTML = s.legacy ? `<b>Earlier interview</b><span class="tag">read-only</span>`
    : e ? `<button class="small" data-step="${sel}">← ${STEP_NAME[sel]}</button><b>${e.id}</b>${e.kind === "observation" ? CLAUDES : `<span class="tag">${e.kind}</span>`}`
    : `<b>${HEADING[sel] || STEP_NAME[sel]}</b><span class="tag">${stepAt(sel) + 1} of ${STEPS.length}</span>`;
  if (!s.legacy) drawRail();
  drawLog();
  drawComposer();
  growAll($("mid"));

  // Bring what is new into view: the check, the draft, or the top of the step that is open.
  const log = $("log");
  const now = {pane: `${sel} ${openId}`, turns: s.turns.length, check: s.check, draft: s.draft};
  const first = !shown.pane, is = (k) => now[k] !== shown[k];
  // The last step opens at its top, where it says the review is drafted and saved.
  const target = (!first && is("check") && $("checkCard")) || ((is("turns") || is("pane") || is("draft")) && log.firstElementChild);
  if (target) log.scrollTo({top: target.offsetTop - log.offsetTop - 12, behavior: first ? "auto" : "smooth"});
  const sources = lastClaude().sources || [];
  if (!first && is("turns") && !view.pending && sources.length) follow(`ann:${sources[0]}`);
  shown = now;
  watchCheck();
}

// While the check runs beside the page, look for its findings. The page is drawn again only when
// they arrive, so nothing being typed is disturbed in the meantime.
let checkPoll = null;
function watchCheck() {
  if (!view.checking || checkPoll) return;
  checkPoll = setInterval(async () => {
    if (busy) return;
    try {
      const data = await (await fetch("/api/state")).json();
      if (data.checking || busy) return;
      clearInterval(checkPoll);
      checkPoll = null;
      view = data;
      draw();
    } catch (_) {}
  }, 3000);
}

/* ---------- light and dark ---------- */

// The button shows where a click leads: the moon in light, the sun in dark. A choice is remembered.
function setTheme(theme, keep) {
  document.documentElement.dataset.theme = theme;
  if (keep) { try { localStorage.setItem("interview-theme", theme); } catch (_) {} track("theme", {theme}); }
  const next = theme === "dark" ? "light" : "dark", b = $("themeBtn");
  b.textContent = next === "dark" ? "🌙" : "☀️";
  b.title = `Switch to ${next} theme`;
  b.setAttribute("aria-label", b.title);
}
$("themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
setTheme(document.documentElement.dataset.theme);
try { setRail(localStorage.getItem("interview-rail") === "hidden", false, +localStorage.getItem("interview-rail-width") || 0); } catch (_) { setRail(false); }
$("paperScroll").addEventListener("scroll", markPage, {passive: true});

// If the page is opened or reloaded while the model is still answering, wait for it.
async function load() {
  view = await (await fetch("/api/state")).json();
  if (!paperDrawn) { unsent = recallUnsent(); track("load", {width: innerWidth, height: innerHeight}); }
  busy = view.busy;
  busySince = busy ? busySince || Date.now() : 0;
  draw();
  if (busy) setTimeout(load, 3000);
}
load();
</script>
